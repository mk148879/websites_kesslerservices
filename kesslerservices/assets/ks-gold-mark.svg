<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KS">
  <defs>
    <linearGradient id="gold" x1="80" y1="60" x2="430" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5d887"/>
      <stop offset="0.48" stop-color="#d6aa55"/>
      <stop offset="1" stop-color="#9a6c2b"/>
    </linearGradient>
    <linearGradient id="panel" x1="60" y1="52" x2="454" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151812"/>
      <stop offset="1" stop-color="#070807"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#d6aa55" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="42" fill="url(#panel)"/>
  <rect x="45" y="45" width="422" height="422" rx="24" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.7"/>
  <rect x="72" y="72" width="368" height="368" rx="13" fill="none" stroke="#f5d887" stroke-width="2" opacity="0.22"/>

  <g filter="url(#softShadow)">
    <text
      x="256"
      y="305"
      text-anchor="middle"
      fill="url(#gold)"
      font-family="Modern No. 20, Didot, Georgia, serif"
      font-size="190"
      font-weight="700"
      letter-spacing="-14"
    >KS</text>
  </g>
</svg>
