name: Deploy Kessler Services

on:
  push:
    branches: [main]
    paths:
      - 'kesslerservices/**'
      - '.github/workflows/deploy-kesslerservices.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the static site, not the old WordPress archive
      - name: Prepare site
        run: rsync -a --exclude '_archiv' --exclude '.gitkeep' kesslerservices/ _site/

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
